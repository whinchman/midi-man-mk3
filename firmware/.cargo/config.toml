[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
linker = "flip-link"
rustflags = [
    # Tell the linker where to find memory.x (placed in OUT_DIR by build.rs).
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "debug"
